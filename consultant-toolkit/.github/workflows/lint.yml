name: Code Quality & Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: uv sync

    - name: Check code formatting with Ruff
      run: uv run ruff format --check libs/ scripts/ tests/

    - name: Lint with Ruff
      run: uv run ruff check libs/ scripts/ tests/

    - name: Type check with mypy
      run: uv run mypy libs/consultant_toolkit/ --config-file mypy.ini

    - name: Security check with bandit
      run: uv run bandit -r libs/ scripts/ -c pyproject.toml
      continue-on-error: true
