name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync

    - name: Run unit tests
      run: uv run pytest tests/ -v -m "not integration and not slow" --cov=libs/consultant_toolkit --cov-report=xml --cov-report=term

    - name: Run integration tests (non-network)
      run: uv run pytest tests/ -v -m "integration and not network and not edgar and not ai" --cov=libs/consultant_toolkit --cov-append --cov-report=xml

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  network-tests:
    name: Network & Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: uv sync

    - name: Run network tests (Yahoo Finance)
      run: uv run pytest tests/ -v -m "network and not edgar and not ai" --tb=short
      continue-on-error: true

    - name: Run SEC EDGAR tests
      if: secrets.SEC_EDGAR_IDENTITY != ''
      env:
        SEC_EDGAR_IDENTITY: ${{ secrets.SEC_EDGAR_IDENTITY }}
      run: uv run pytest tests/ -v -m "edgar" --tb=short
      continue-on-error: true

    - name: Run AI tests
      if: secrets.GOOGLE_API_KEY != ''
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: uv run pytest tests/ -v -m "ai" --tb=short
      continue-on-error: true
