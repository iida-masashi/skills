# Starting point for a Cloud Run deploy workflow.
# Save this to <repo-root>/.github/workflows/<app-name>-deploy.yml — GitHub only
# recognizes workflows in the repo root's .github/workflows/, even in a monorepo.
# Replace every <PLACEHOLDER> before use. See references/cloud-run-deploy.md for
# the annotated walkthrough and the multi-service variant.

name: Deploy <APP_NAME> to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - '<SUBPROJECT_DIR>/**'
      - '.github/workflows/<THIS_FILE_NAME>.yml'
  workflow_dispatch:

env:
  PROJECT_ID: <PROJECT_ID>
  REGION: <REGION>
  AR_HOST: <REGION>-docker.pkg.dev
  AR_REPO: <ARTIFACT_REGISTRY_REPO>
  SERVICE: <SERVICE_NAME>
  IMAGE_NAME: <SERVICE_NAME>

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud (WIF)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AR_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image=${{ env.AR_HOST }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./<SUBPROJECT_DIR>
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.AR_HOST }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=${{ env.SERVICE }}
          cache-to: type=gha,mode=max,scope=${{ env.SERVICE }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ needs.build.outputs.image }}
          secrets: |
            <ENV_VAR_NAME>=<SECRET_NAME>:latest
          flags: >-
            --allow-unauthenticated
            --service-account=<RUNTIME_SA_EMAIL>
            --memory=<MEMORY e.g. 512Mi>
            --cpu=<CPU_COUNT e.g. 1>
            --timeout=<TIMEOUT_SECONDS e.g. 300>
            --max-instances=<MAX_INSTANCES e.g. 2>
            --min-instances=0
            --port=<CONTAINER_PORT e.g. 8080>

      - name: Show service URL
        run: |
          echo "Service URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
