name: Deploy anaplan-skill (model_analyzer) to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'anaplan-skill/**'
      - '.github/workflows/anaplan-skill-deploy.yml'
  workflow_dispatch:

env:
  PROJECT_ID: trim-opus-407712
  REGION: asia-northeast1
  AR_HOST: asia-northeast1-docker.pkg.dev
  AR_REPO: apps
  SERVICE: anaplan-model-analyzer
  IMAGE_NAME: anaplan-model-analyzer

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud (WIF)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AR_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image=${{ env.AR_HOST }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./anaplan-skill
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.AR_HOST }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=anaplan-model-analyzer
          cache-to: type=gha,mode=max,scope=anaplan-model-analyzer

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ needs.build.outputs.image }}
          secrets: |
            ANAPLAN_USER=ANAPLAN_USER:latest
            ANAPLAN_PASSWORD=ANAPLAN_PASSWORD:latest
            ANAPLAN_WS=ANAPLAN_WS:latest
            ANAPLAN_MODEL=ANAPLAN_MODEL:latest
            APP_LOGIN_USER=APP_LOGIN_USER:latest
            APP_LOGIN_PASSWORD_HASH=APP_LOGIN_PASSWORD_HASH:latest
            APP_COOKIE_KEY=APP_COOKIE_KEY:latest
            GEMINI_API_KEY=GEMINI_API_KEY:latest
          flags: >-
            --allow-unauthenticated
            --service-account=anaplan-skill-runtime@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --memory=2Gi
            --cpu=1
            --timeout=3600
            --max-instances=2
            --min-instances=0
            --port=8080

      - name: Show service URL
        run: |
          echo "Service URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
