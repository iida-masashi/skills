[project]
name = "web-search-skill"
version = "0.1.0"
description = "Gemini API (Google Search grounding / URL context) tools for the web-search skill"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
