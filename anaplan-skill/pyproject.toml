[project]
name = "anaplan-skill"
version = "2.1.0"
description = "Anaplan integration suite for workspace history auditing and model analysis."
readme = "SKILL.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0.0",
    "google-genai>=0.2.0",
    "numpy>=1.23.0",
    "pandas>=2.0.0",
    "anaplan-sdk>=0.1.0",
    "requests>=2.28.0",
    "streamlit>=1.28.0",
    "networkx>=3.0.0",
    "pyvis>=0.3.1",
    "python-dotenv>=1.0.0",
    "xlsxwriter>=3.0.0",
    "streamlit-authenticator>=0.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock"
]

[tool.setuptools]
packages = ["libs", "libs.common", "libs.history_audit", "libs.model_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["libs"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "C4", "B"]
ignore = ["E501", "B008", "E402", "E701", "E702", "E741", "N803", "N806", "N999", "B904", "B017", "F821"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
