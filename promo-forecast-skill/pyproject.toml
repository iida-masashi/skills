[project]
name = "promo-forecast-skill"
version = "0.1.0"
description = "SCM Promotion Forecasting POC (Prophet + LightGBM Hybrid)"
requires-python = ">=3.12"
dependencies = [
    "polars",
    "pandas",
    "numpy",
    "darts",
    "prophet",
    "lightgbm",
    "streamlit",
    "plotly",
    "pytest",
    "optuna",
]

[tool.uv]
managed = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["libs*", "scripts*"]
